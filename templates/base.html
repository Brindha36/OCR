<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Invoice Management System{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --surface: #ffffff;
            --background: #f8fafc;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #16a34a;
            --sidebar-width: 240px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        html, body {
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            display: flex;
        }

        /* Sidebar Base (Desktop) */
        aside.sidebar {
            width: var(--sidebar-width);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 1000;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-brand {
            padding: 18px 18px;
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            color: var(--primary);
        }

        .close-sidebar-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.1rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
        }

        .nav-list {
            list-style: none;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .nav-item a:hover {
            background-color: #f1f5f9;
            color: var(--text-main);
        }

        .nav-item.active a {
            background-color: #eff6ff;
            color: var(--primary);
        }

        /* Dark Mobile Overlay */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            z-index: 999;
            backdrop-filter: blur(2px);
        }

        .sidebar-backdrop.active {
            display: block;
        }

        /* Content Area */
        .content-area {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 100vh;
            width: calc(100% - var(--sidebar-width));
        }

        header.top-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Mobile Hamburger Toggle Button */
        .menu-toggle-btn {
            display: none;
            background: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 11px;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
        }
        .menu-toggle-btn:hover {
            background: #e2e8f0;
        }

        .top-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1e293b;
        }

        .main-body {
            padding: 20px 24px;
            flex: 1;
        }

        /* Responsive Mobile Breakpoints (Under 992px) */
        @media (max-width: 992px) {
            aside.sidebar {
                transform: translateX(-100%);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
            }

            aside.sidebar.open {
                transform: translateX(0);
            }

            .close-sidebar-btn {
                display: block;
            }

            .menu-toggle-btn {
                display: inline-flex;
            }

            .content-area {
                margin-left: 0 !important;
                width: 100% !important;
            }

            header.top-bar {
                padding: 12px 16px;
            }

            .main-body {
                padding: 16px 14px;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>

    <!-- Mobile Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Left Sidebar -->
    <aside class="sidebar" id="appSidebar">
        <div class="sidebar-brand">
            <div style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-receipt"></i>
                <span>GST Invoice AI</span>
            </div>
            <button class="close-sidebar-btn" id="closeSidebarBtn" aria-label="Close Sidebar">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <ul class="nav-list">
            <li class="nav-item {% block nav_dashboard %}{% endblock %}">
                <a href="/"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            </li>
            <li class="nav-item {% block nav_upload %}{% endblock %}">
                <a href="/upload"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Invoice</a>
            </li>
            <li class="nav-item {% block nav_export %}{% endblock %}">
                <a href="/export"><i class="fa-solid fa-file-excel"></i> Export Invoice</a>
            </li>
        </ul>
    </aside>

    <!-- Main Workspace Container -->
    <div class="content-area">
        <header class="top-bar">
            <div class="header-left">
                <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="Toggle Sidebar Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="top-title">{% block page_title %}{% endblock %}</div>
            </div>
            <div style="font-size: 0.78rem; color: var(--text-muted); font-weight: 500;">
                Database: <b>invoice_db</b>
            </div>
        </header>
        <div class="main-body">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        // Global Mobile Drawer Toggle
        const appSidebar = document.getElementById('appSidebar');
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');

        function openSidebar() {
            appSidebar.classList.add('open');
            sidebarBackdrop.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            appSidebar.classList.remove('open');
            sidebarBackdrop.classList.remove('active');
            document.body.style.overflow = '';
        }

        if (menuToggleBtn) menuToggleBtn.addEventListener('click', openSidebar);
        if (closeSidebarBtn) closeSidebarBtn.addEventListener('click', closeSidebar);
        if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebar);

        // Auto-close drawer on link click in mobile view
        document.querySelectorAll('.nav-item a').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 992) closeSidebar();
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
